<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DMS Chat</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --gold:#D4AF37;
    --gold2:#F5D76E;
    --gold3:#B8860B;
    --light:#FFFDF5;
    --card:#FFFFFF;
    --text:#211F16;
    --muted:#77705D;
    --border:#E8D99A;
    --green:#20a464;
    --danger:#dc3545;
    --shadow:0 4px 18px rgba(0,0,0,.08);
}

*{
    scrollbar-width:thin;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--light);
    color:var(--text);
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* AUTH */

.authScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at top right,#F5D76E55,transparent 35%),
        linear-gradient(135deg,#fffdf5,#f8edbd);
}

.authBox{
    width:100%;
    max-width:430px;
    background:white;
    padding:25px;
    border-radius:22px;
    box-shadow:var(--shadow);
}

.logo{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:bold;
    box-shadow:0 6px 20px #D4AF3744;
}

.authBox h1{
    text-align:center;
    margin:12px 0 5px;
}

.subtitle{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    margin-bottom:20px;
}

.formGroup{
    margin-bottom:13px;
}

.formGroup label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

input,
textarea{
    width:100%;
    border:1px solid var(--border);
    background:white;
    color:var(--text);
    border-radius:11px;
    padding:12px;
    outline:none;
}

input:focus,
textarea:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px #D4AF3718;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.primaryBtn{
    width:100%;
    border:0;
    padding:12px;
    border-radius:11px;
    background:linear-gradient(135deg,var(--gold3),var(--gold));
    color:white;
    font-weight:bold;
}

.secondaryBtn{
    border:1px solid var(--gold);
    background:white;
    color:var(--gold3);
    padding:10px 13px;
    border-radius:10px;
    font-weight:bold;
}

.authSwitch{
    text-align:center;
    margin-top:15px;
    font-size:13px;
}

.authSwitch span{
    color:var(--gold3);
    font-weight:bold;
    cursor:pointer;
}

/* APP */

.app{
    min-height:100vh;
    padding-bottom:68px;
}

.topHeader{
    height:64px;
    position:sticky;
    top:0;
    z-index:20;
    background:white;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:bold;
    color:var(--gold3);
}

.brandIcon{
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
}

.headerActions{
    display:flex;
    gap:6px;
}

.iconBtn{
    border:1px solid var(--border);
    background:white;
    width:38px;
    height:38px;
    border-radius:10px;
}

/* PAGES */

.page{
    padding:15px;
    max-width:900px;
    margin:auto;
}

.pageTitle{
    font-size:21px;
    margin:5px 0 15px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:15px;
    margin-bottom:13px;
    box-shadow:var(--shadow);
}

/* PROFILE */

.profileHero{
    text-align:center;
}

.profilePhoto{
    width:105px;
    height:105px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid var(--gold);
    background:#eee;
}

.profileName{
    font-size:20px;
    font-weight:bold;
    margin-top:10px;
}

.onlineDot{
    display:inline-block;
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--green);
    margin-left:5px;
}

.bio{
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
}

/* DISCOVER */

.searchBox{
    margin-bottom:15px;
}

.userCard{
    display:flex;
    align-items:center;
    gap:12px;
}

.userAvatar{
    width:58px;
    height:58px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--gold);
    background:#eee;
}

.userInfo{
    flex:1;
    min-width:0;
}

.userInfo strong{
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.userInfo small{
    color:var(--muted);
    display:block;
    margin-top:2px;
}

.cardButtons{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.smallBtn{
    border:1px solid var(--border);
    background:white;
    color:var(--gold3);
    border-radius:8px;
    padding:7px 9px;
    font-size:11px;
}

/* CHAT */

.chatPage{
    padding:0;
    height:calc(100vh - 68px);
    overflow:hidden;
}

.chatHeader{
    position:sticky;
    top:0;
    z-index:10;
    height:64px;
    background:white;
    border-bottom:1px solid var(--border);
    padding:8px 12px;
    display:flex;
    align-items:center;
    gap:10px;
}

.backBtn{
    border:0;
    background:transparent;
    font-size:22px;
}

.chatHeaderUser{
    display:flex;
    align-items:center;
    gap:8px;
    flex:1;
    min-width:0;
}

.chatHeaderUser img{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--gold);
}

.chatHeaderName{
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chatMessages{
    height:calc(100vh - 200px);
    overflow-y:auto;
    padding:15px;
    padding-bottom:100px;
    background:#fffdf7;
    scroll-behavior:smooth;
}

.message{
    max-width:78%;
    margin-bottom:10px;
    padding:9px 11px;
    border-radius:14px;
    word-wrap:break-word;
    overflow-wrap:anywhere;
    box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.message.mine{
    margin-left:auto;
    background:linear-gradient(135deg,var(--gold3),var(--gold));
    color:white;
    border-bottom-right-radius:4px;
}

.message.theirs{
    margin-right:auto;
    background:white;
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
}

.messageImage{
    display:block;
    max-width:260px;
    max-height:350px;
    width:auto;
    height:auto;
    border-radius:12px;
    object-fit:contain;
    cursor:pointer;
    margin-bottom:6px;
}

.messageTime{
    font-size:9px;
    opacity:.75;
    text-align:right;
    margin-top:5px;
}

.messageActions{
    display:flex;
    gap:5px;
    margin-top:6px;
}

.messageActions .smallBtn{
    padding:4px 7px;
    font-size:9px;
}

.chatComposer{
    position:fixed;
    bottom:68px;
    left:0;
    right:0;
    min-height:68px;
    background:white;
    border-top:1px solid var(--border);
    padding:8px;
    display:flex;
    gap:6px;
    z-index:15;
}

.chatComposer input{
    flex:1;
    min-width:0;
    border-radius:22px;
    padding:10px 13px;
}

.composerBtn{
    width:43px;
    height:43px;
    flex-shrink:0;
    border:1px solid var(--border);
    background:white;
    color:var(--gold3);
    border-radius:50%;
}

.sendBtn{
    background:var(--gold);
    color:white;
    border:0;
}

.replyPreview{
    position:fixed;
    bottom:136px;
    left:8px;
    right:8px;
    z-index:14;
    background:white;
    border:1px solid var(--border);
    border-left:4px solid var(--gold);
    padding:9px;
    border-radius:10px;
    box-shadow:var(--shadow);
}

.replyPreview button{
    float:right;
    border:0;
    background:none;
}

/* STATUS */

.statusRow{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:5px 0 15px;
    scroll-behavior:smooth;
}

.statusItem{
    min-width:68px;
    max-width:75px;
    text-align:center;
    font-size:11px;
    cursor:pointer;
    flex-shrink:0;
}

.statusItem div:last-child{
    margin-top:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.statusAvatar{
    width:58px;
    height:58px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid var(--gold);
    margin:auto;
    background:#eee;
}

.addStatus{
    width:58px;
    height:58px;
    border-radius:50%;
    border:3px dashed var(--gold);
    background:white;
    color:var(--gold3);
    font-size:25px;
}

/* BOTTOM NAV */

.bottomNav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    z-index:30;
    background:white;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.navBtn{
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:10px;
    min-width:55px;
}

.navBtn span{
    display:block;
    font-size:21px;
    margin-bottom:2px;
}

.navBtn.active{
    color:var(--gold3);
    font-weight:bold;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modalBox{
    width:100%;
    max-width:450px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    border-radius:18px;
    padding:18px;
}

.modalHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.closeBtn{
    border:0;
    background:#eee;
    width:34px;
    height:34px;
    border-radius:50%;
}

/* IMAGE VIEWER */

.largeImageBox{
    width:100%;
    max-height:80vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.largeImageBox img{
    max-width:100%;
    max-height:80vh;
    object-fit:contain;
    border-radius:10px;
}

/* STATUS VIEWER */

.statusViewer{
    position:fixed;
    inset:0;
    z-index:110;
    background:#111;
    color:white;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.statusTop{
    padding:12px;
    display:flex;
    gap:8px;
    align-items:center;
    position:relative;
    z-index:5;
}

.statusProgress{
    display:flex;
    gap:4px;
    flex:1;
}

.statusProgress div{
    height:3px;
    background:#777;
    flex:1;
    border-radius:5px;
}

.statusProgress div.active{
    background:white;
}

.statusUser{
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 15px 8px;
    position:relative;
    z-index:5;
}

.statusUser img,
.statusUserAvatar{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid white;
}

.statusUserName{
    font-weight:bold;
    font-size:14px;
}

.statusUserTime{
    font-size:10px;
    opacity:.7;
    margin-top:2px;
}

.statusContent{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
    position:relative;
    overflow:hidden;
}

.statusContent img{
    max-width:100%;
    max-height:65vh;
    object-fit:contain;
    border-radius:10px;
}

.statusText{
    font-size:25px;
    text-align:center;
    padding:20px;
    max-width:90%;
    word-break:break-word;
}

.statusEmpty{
    text-align:center;
    color:#aaa;
}

.statusBottom{
    padding:12px;
    position:relative;
    z-index:6;
}

.statusReplyInput{
    background:#222;
    color:white;
    border:1px solid #555;
}

.statusReplyInput::placeholder{
    color:#aaa;
}

.statusNav{
    position:absolute;
    top:0;
    bottom:0;
    width:35%;
    border:0;
    background:transparent;
    z-index:2;
}

.statusNavLeft{
    left:0;
}

.statusNavRight{
    right:0;
}

.statusNavHint{
    position:absolute;
    bottom:90px;
    left:50%;
    transform:translateX(-50%);
    font-size:10px;
    color:#aaa;
    pointer-events:none;
    white-space:nowrap;
}

/* DARK */

body.dark{
    --light:#121212;
    --card:#1d1d1d;
    --text:#f4f4f4;
    --muted:#aaa;
    --border:#4a411f;
}

body.dark .topHeader,
body.dark .bottomNav,
body.dark .chatHeader,
body.dark .chatComposer,
body.dark .modalBox,
body.dark input,
body.dark textarea,
body.dark .secondaryBtn,
body.dark .smallBtn,
body.dark .iconBtn,
body.dark .composerBtn{
    background:#1d1d1d;
    color:var(--text);
}

body.dark .chatMessages{
    background:#111;
}

body.dark .message.theirs{
    background:#242424;
    color:white;
}

body.dark .replyPreview{
    background:#1d1d1d;
}

body.dark .addStatus{
    background:#1d1d1d;
}

/* RESPONSIVE */

@media(max-width:480px){

    .page{
        padding:12px;
    }

    .message{
        max-width:86%;
    }

    .messageImage{
        max-width:230px;
        max-height:300px;
    }

    .statusText{
        font-size:23px;
    }
}
</style>
</head>

<body>

<!-- AUTH -->

<div id="authScreen" class="authScreen">

    <div class="authBox">

        <div class="logo">💬</div>

        <h1>DMS Chat</h1>

        <div class="subtitle">
            Connect • Communicate • Chat
        </div>

        <form id="loginForm">

            <div class="formGroup">
                <label>Email</label>
                <input
                    id="loginEmail"
                    type="email"
                    required
                    placeholder="Enter email">
            </div>

            <div class="formGroup">
                <label>Password</label>
                <input
                    id="loginPassword"
                    type="password"
                    required
                    placeholder="Enter password">
            </div>

            <button class="primaryBtn">
                Login
            </button>

            <div class="authSwitch">
                Don't have an account?
                <span onclick="showRegister()">
                    Register
                </span>
            </div>

            <div class="authSwitch">
                <span onclick="showReset()">
                    Forgot password?
                </span>
            </div>

        </form>

        <form id="registerForm" class="hidden">

            <div class="formGroup">
                <label>Full Name</label>
                <input
                    id="registerName"
                    required
                    placeholder="Your name">
            </div>

            <div class="formGroup">
                <label>Username</label>
                <input
                    id="registerUsername"
                    required
                    placeholder="Username">
            </div>

            <div class="formGroup">
                <label>Email</label>
                <input
                    id="registerEmail"
                    type="email"
                    required
                    placeholder="Email">
            </div>

            <div class="formGroup">
                <label>Password</label>
                <input
                    id="registerPassword"
                    type="password"
                    minlength="6"
                    required
                    placeholder="Minimum 6 characters">
            </div>

            <div class="formGroup">
                <label>Bio</label>
                <textarea
                    id="registerBio"
                    placeholder="Tell people about yourself"></textarea>
            </div>

            <div class="formGroup">
                <label>Profile Photo</label>
                <input
                    id="registerPhoto"
                    type="file"
                    accept="image/*">
            </div>

            <button class="primaryBtn">
                Create Account
            </button>

            <div class="authSwitch">
                Already have an account?
                <span onclick="showLogin()">
                    Login
                </span>
            </div>

        </form>

        <form id="resetForm" class="hidden">

            <div class="formGroup">
                <label>Email</label>
                <input
                    id="resetEmail"
                    type="email"
                    required
                    placeholder="Your email">
            </div>

            <button class="primaryBtn">
                Send Reset Link
            </button>

            <div class="authSwitch">
                <span onclick="showLogin()">
                    Back to Login
                </span>
            </div>

        </form>

    </div>
</div>


<!-- APP -->

<div id="app" class="app hidden">

    <header class="topHeader">

        <div class="brand">
            <div class="brandIcon">💬</div>
            DMS Chat
        </div>

        <div class="headerActions">

            <button
                class="iconBtn"
                onclick="toggleDarkMode()">
                🌙
            </button>

            <button
                class="iconBtn"
                onclick="logout()">
                🚪
            </button>

        </div>

    </header>


    <!-- HOME -->

    <section id="homePage" class="page">

        <h2 class="pageTitle">
            Welcome to DMS Chat
        </h2>

        <div id="homeProfile"></div>

        <div class="card">

            <h3>Statuses</h3>

            <div id="statusRow" class="statusRow"></div>

        </div>

    </section>


    <!-- DISCOVER -->

    <section id="discoverPage" class="page hidden">

        <h2 class="pageTitle">
            Discover
        </h2>

        <div class="searchBox">

            <input
                id="searchInput"
                placeholder="Search people..."
                oninput="renderDiscover()">

        </div>

        <div id="discoverList"></div>

    </section>


    <!-- MESSAGES -->

    <section id="messagesPage" class="page hidden">

        <h2 class="pageTitle">
            Messages
        </h2>

        <div id="conversationList"></div>

    </section>


    <!-- PROFILE -->

    <section id="profilePage" class="page hidden">

        <h2 class="pageTitle">
            My Profile
        </h2>

        <div id="myProfile"></div>

    </section>


    <!-- CHAT -->

    <section id="chatPage" class="chatPage hidden">

        <div class="chatHeader">

            <button
                class="backBtn"
                onclick="closeChat()">
                ←
            </button>

            <div
                id="chatHeaderUser"
                class="chatHeaderUser">
            </div>

        </div>

        <div
            id="chatMessages"
            class="chatMessages">
        </div>

        <div
            id="replyPreview"
            class="replyPreview hidden">

            <button onclick="cancelStatusReply()">
                ✕
            </button>

            <strong>Replying to status</strong>

            <div id="replyPreviewText"></div>

        </div>

        <div class="chatComposer">

            <button
                class="composerBtn"
                onclick="sendImage()">
                🖼️
            </button>

            <input
                id="messageInput"
                placeholder="Write a message..."
                onkeydown="handleMessageKey(event)">

            <button
                class="composerBtn sendBtn"
                onclick="sendMessage()">
                ➤
            </button>

        </div>

    </section>


    <!-- BOTTOM NAV -->

    <nav class="bottomNav">

        <button
            id="navHome"
            class="navBtn active"
            onclick="showPage('home')">
            <span>🏠</span>
            Home
        </button>

        <button
            id="navDiscover"
            class="navBtn"
            onclick="showPage('discover')">
            <span>🔎</span>
            Discover
        </button>

        <button
            id="navMessages"
            class="navBtn"
            onclick="showPage('messages')">
            <span>💬</span>
            Messages
        </button>

        <button
            id="navProfile"
            class="navBtn"
            onclick="showPage('profile')">
            <span>👤</span>
            Profile
        </button>

    </nav>

</div>


<!-- PROFILE MODAL -->

<div id="profileModal" class="modal hidden">

    <div class="modalBox">

        <div class="modalHeader">

            <strong>Profile</strong>

            <button
                class="closeBtn"
                onclick="closeModal('profileModal')">
                ✕
            </button>

        </div>

        <div id="profileModalContent"></div>

    </div>

</div>


<!-- EDIT PROFILE -->

<div id="editProfileModal" class="modal hidden">

    <div class="modalBox">

        <div class="modalHeader">

            <strong>Edit Profile</strong>

            <button
                class="closeBtn"
                onclick="closeModal('editProfileModal')">
                ✕
            </button>

        </div>

        <form id="editProfileForm">

            <div class="formGroup">
                <label>Full Name</label>
                <input id="editName" required>
            </div>

            <div class="formGroup">
                <label>Username</label>
                <input id="editUsername" required>
            </div>

            <div class="formGroup">
                <label>Bio</label>
                <textarea id="editBio"></textarea>
            </div>

            <div class="formGroup">
                <label>New Profile Photo</label>
                <input
                    id="editPhoto"
                    type="file"
                    accept="image/*">
            </div>

            <button class="primaryBtn">
                Save Changes
            </button>

        </form>

    </div>

</div>


<!-- IMAGE VIEWER -->

<div id="imageViewer" class="modal hidden">

    <div class="largeImageBox">

        <img id="largeImage" src="" alt="Image">

    </div>

    <button
        class="closeBtn"
        style="position:absolute;top:15px;right:15px"
        onclick="closeModal('imageViewer')">
        ✕
    </button>

</div>

function escapeHtml(value){

    if(
        value === undefined ||
        value === null
    ){
        return "";
    }

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function getTime(value){

    if(!value){
        return 0;
    }

    if(
        typeof value.toMillis ===
        "function"
    ){
        return value.toMillis();
    }

    if(
        typeof value.toDate ===
        "function"
    ){
        return value.toDate().getTime();
    }

    if(
        typeof value.seconds ===
        "number"
    ){
        return value.seconds * 1000;
    }

    if(
        value instanceof Date
    ){
        return value.getTime();
    }

    const parsed =
        new Date(value).getTime();

    return Number.isNaN(parsed)
        ? 0
        : parsed;
}


function formatTime(value){

    const time =
        getTime(value);

    if(!time){
        return "";
    }

    return new Date(time)
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}


function formatDate(value){

    const time =
        getTime(value);

    if(!time){
        return "";
    }

    return new Date(time)
        .toLocaleDateString();
}


/* =========================================================
   IMAGE COMPRESSION
========================================================= */

function compressImage(
    file,
    maxSize = 500,
    quality = .55
){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();

            reader.onload =
                function(e){

                    const img =
                        new Image();

                    img.onload =
                        function(){

                            let width =
                                img.width;

                            let height =
                                img.height;


                            if(
                                width >
                                height
                            ){

                                if(
                                    width >
                                    maxSize
                                ){

                                    height =
                                        height *
                                        (
                                            maxSize /
                                            width
                                        );

                                    width =
                                        maxSize;
                                }

                            }else{

                                if(
                                    height >
                                    maxSize
                                ){

                                    width =
                                        width *
                                        (
                                            maxSize /
                                            height
                                        );

                                    height =
                                        maxSize;
                                }
                            }


                            const canvas =
                                document
                                .createElement(
                                    "canvas"
                                );

                            canvas.width =
                                Math.round(
                                    width
                                );

                            canvas.height =
                                Math.round(
                                    height
                                );


                            const ctx =
                                canvas
                                .getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                canvas.width,
                                canvas.height
                            );


                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    quality
                                )
                            );
                        };


                    img.onerror =
                        () => reject(
                            new Error(
                                "Unable to read image."
                            )
                        );


                    img.src =
                        e.target.result;
                };


            reader.onerror =
                () => reject(
                    new Error(
                        "Unable to read selected file."
                    )
                );


            reader.readAsDataURL(file);
        }
    );
}

/* =========================================================
   LIKE / MATCH
========================================================= */

window.likeUser =
async function(uid){

    if(!currentUser){
        return;
    }


    try{

        const myRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const targetRef =
            doc(
                db,
                "users",
                uid
            );


        const mySnap =
            await getDoc(
                myRef
            );


        const targetSnap =
            await getDoc(
                targetRef
            );


        if(
            !mySnap.exists() ||
            !targetSnap.exists()
        ){
            return;
        }


        const me =
            mySnap.data();


        const target =
            targetSnap.data();


        let liked =
            Array.isArray(
                me.likedUsers
            )
            ? [...me.likedUsers]
            : [];


        if(
            !liked.includes(uid)
        ){

            liked.push(uid);


            await updateDoc(
                myRef,
                {
                    likedUsers:
                        liked
                }
            );
        }


        const targetLikes =
            Array.isArray(
                target.likedUsers
            )
            ? target.likedUsers
            : [];


        if(
            targetLikes.includes(
                currentUser.uid
            )
        ){

            let myMatches =
                Array.isArray(
                    me.matches
                )
                ? [...me.matches]
                : [];


            let targetMatches =
                Array.isArray(
                    target.matches
                )
                ? [...target.matches]
                : [];


            if(
                !myMatches.includes(
                    uid
                )
            ){

                myMatches.push(
                    uid
                );
            }


            if(
                !targetMatches.includes(
                    currentUser.uid
                )
            ){

                targetMatches.push(
                    currentUser.uid
                );
            }


            await updateDoc(
                myRef,
                {
                    matches:
                        myMatches
                }
            );


            await updateDoc(
                targetRef,
                {
                    matches:
                        targetMatches
                }
            );


            alert(
                "It's a match! ❤️"
            );

        }else{

            alert(
                "Liked ❤️"
            );
        }


        await loadCurrentProfile();

        await loadUsers();

        renderDiscover();

    }catch(error){

        alert(
            "Like failed:\n\n" +
            error.message
        );
    }
};

/* =========================================================
   SUBSCRIBE MESSAGES
========================================================= */

function subscribeMessages(){

    if(unsubscribeMessages){

        unsubscribeMessages();

        unsubscribeMessages =
            null;
    }


    if(
        !currentUser ||
        !activeChatUser
    ){
        return;
    }


    const participants = [

        currentUser.uid,
        activeChatUser.uid

    ].sort();


    const q =
        query(
            collection(
                db,
                "messages"
            ),
            where(
                "participants",
                "==",
                participants
            )
        );


    unsubscribeMessages =
        onSnapshot(

            q,

            snapshot => {

                const container =
                    $("chatMessages");


                container.innerHTML =
                    "";


                const messages = [];


                snapshot.forEach(
                    item => {

                        messages.push({

                            id:item.id,

                            ...item.data()

                        });
                    }
                );


                messages.sort(
                    (a,b) =>
                        getTime(
                            a.createdAt
                        ) -
                        getTime(
                            b.createdAt
                        )
                );


                if(
                    !messages.length
                ){

                    container.innerHTML = `

                        <div
                            style="
                                text-align:center;
                                color:var(--muted);
                                padding:40px 15px;
                            ">

                            No messages yet.<br>

                            Start the conversation 💬

                        </div>

                    `;

                    return;
                }


                messages.forEach(
                    msg => {

                        const mine =
                            msg.sender ===
                            currentUser.uid;


                        const div =
                            document
                            .createElement(
                                "div"
                            );


                        div.className =
                            "message " +
                            (
                                mine
                                ? "mine"
                                : "theirs"
                            );


                        let replyHtml =
                            "";


                        if(
                            msg.statusReply
                        ){

                            replyHtml = `

                                <div
                                    style="
                                        padding:7px;
                                        margin-bottom:6px;
                                        border-left:3px solid var(--gold);
                                        background:rgba(0,0,0,.08);
                                        font-size:11px;
                                        border-radius:5px;
                                    ">

                                    💬 Status reply:

                                    ${escapeHtml(
                                        msg.statusReply.text ||
                                        "Photo status"
                                    )}

                                </div>

                            `;
                        }


                        let textHtml =
                            "";


                        if(msg.text){

                            textHtml = `

                                <div>
                                    ${escapeHtml(
                                        msg.text
                                    )}
                                </div>

                            `;
                        }


                        const editedHtml =
                            msg.edited
                            ? `<span style="font-size:9px">(edited)</span>`
                            : "";


                        let actionsHtml =
                            "";


                        if(mine){

                            actionsHtml = `

                                <div
                                    class="messageActions">

                                    ${
                                        msg.text
                                        ? `
                                            <button
                                                class="smallBtn"
                                                onclick="editMessage('${msg.id}')">
                                                Edit
                                            </button>
                                        `
                                        : ""
                                    }

                                    <button
                                        class="smallBtn"
                                        onclick="deleteMessage('${msg.id}')">
                                        Delete
                                    </button>

                                </div>

                            `;
                        }


                        div.innerHTML =
                            replyHtml +
                            textHtml +
                            `

                                <div
                                    class="messageTime">

                                    ${formatTime(
                                        msg.createdAt
                                    )}

                                    ${editedHtml}

                                    ${
                                        mine
                                        ? (
                                            msg.read
                                            ? " ✓✓ Read"
                                            : msg.delivered
                                            ? " ✓✓ Delivered"
                                            : " ✓ Sent"
                                        )
                                        : ""
                                    }

                                </div>

                                ${actionsHtml}

                            `;


                        if(
                            msg.mediaURL
                        ){

                            const image =
                                document
                                .createElement(
                                    "img"
                                );


                            image.className =
                                "messageImage";


                            image.src =
                                msg.mediaURL;


                            image.alt =
                                "Sent image";


                            image.onload =
                                function(){

                                    setTimeout(
                                        () => {

                                            container
                                                .scrollTop =
                                                container
                                                .scrollHeight;

                                        },
                                        50
                                    );
                                };


                            image.onerror =
                                function(){

                                    image.alt =
                                        "Image could not be displayed";

                                    image.style.padding =
                                        "20px";

                                    image.style.background =
                                        "#eee";
                                };


                            image.onclick =
                                function(){

                                    openImageViewer(
                                        msg.mediaURL
                                    );
                                };


                            div.insertBefore(
                                image,
                                div.firstChild
                            );
                        }


                        container.appendChild(
                            div
                        );
                    }
                );


                setTimeout(
                    () => {

                        container.scrollTop =
                            container.scrollHeight;

                        markMessagesAsRead();

                    },
                    80
                );

            },


            error => {

                console.error(
                    "Messages error:",
                    error
                );


                $("chatMessages")
                    .innerHTML = `

                        <div
                            class="card"
                            style="
                                color:#dc3545;
                                text-align:center;
                            ">

                            <strong>
                                Unable to load messages
                            </strong>

                            <p
                                style="
                                    font-size:12px;
                                    margin-bottom:0;
                                ">

                                ${escapeHtml(
                                    error.message
                                )}

                            </p>

                        </div>
                    `;
            }
        );
}


/* =========================================================
   MARK MESSAGES AS READ
========================================================= */

async function markMessagesAsRead(){

    if(
        !currentUser ||
        !activeChatUser
    ){
        return;
    }


    const participants = [

        currentUser.uid,
        activeChatUser.uid

    ].sort();


    const q =
        query(
            collection(
                db,
                "messages"
            ),
            where(
                "participants",
                "==",
                participants
            )
        );


    try{

        const snapshot =
            await getDocs(q);


        const updates = [];


        snapshot.forEach(
            item => {

                const msg =
                    item.data();


                if(
                    msg.receiver ===
                    currentUser.uid &&
                    msg.read !== true
                ){

                    updates.push(

                        updateDoc(
                            doc(
                                db,
                                "messages",
                                item.id
                            ),
                            {
                                read:true,
                                delivered:true
                            }
                        )

                    );
                }
            }
        );


        await Promise.all(
            updates
        );

    }catch(error){

        console.error(
            "Mark read error:",
            error
        );
    }
}

async function(messageId){

        doc(

    try{

            await getDoc(ref);


        if(!snap.exists()){
            return;

        const data =
            snap.data();


        if(
            data.sender !==
            currentUser.uid
        ){

        const newText =
            prompt(

        await updateDoc(

            }
        );

    }catch(error){

/* =========================================================
   CONVERSATIONS
========================================================= */

function subscribeConversations(){

    if(!currentUser){
        return;
    }


    if(
        unsubscribeConversations
    ){

        unsubscribeConversations();

        unsubscribeConversations =
            null;
    }


    const q =
        query(
            collection(
                db,
                "messages"
            ),
            where(
                "participants",
                "array-contains",
                currentUser.uid
            )
        );


    unsubscribeConversations =
        onSnapshot(
            q,
            async snapshot => {

                const latest = {};


                snapshot.forEach(
                    item => {

                        const msg =
                            item.data();


                        const other =
                            msg.sender ===
                            currentUser.uid
                            ? msg.receiver
                            : msg.sender;


                        if(
                            !latest[other] ||
                            getTime(
                                msg.createdAt
                            ) >
                            getTime(
                                latest[other]
                                    .createdAt
                            )
                        ){

                            latest[other] = {

                                id:item.id,

                                ...msg

                            };
                        }
                    }
                );


                const container =
                    $("conversationList");


                if(!container){
                    return;
                }


                container.innerHTML =
                    "";


                const ids =
                    Object.keys(
                        latest
                    );


                if(!ids.length){

                    container.innerHTML = `

                        <div class="card">

                            No conversations yet.

                        </div>
                    `;

                    return;
                }


                for(
                    const uid of ids
                ){

                    let user =
                        allUsers.find(
                            x =>
                                x.uid ===
                                uid
                        );


                    if(!user){

                        try{

                            const userSnap =
                                await getDoc(
                                    doc(
                                        db,
                                        "users",
                                        uid
                                    )
                                );


                            if(
                                userSnap.exists()
                            ){

                                user = {

                                    uid:uid,

                                    ...userSnap.data()

                                };
                            }

                        }catch(error){

                            console.error(
                                error
                            );
                        }
                    }


                    if(!user){
                        continue;
                    }


                    const msg =
                        latest[uid];


                    const card =
                        document
                        .createElement(
                            "div"
                        );


                    card.className =
                        "card userCard";


                    card.onclick =
                        () =>
                            openChat(uid);


                    card.innerHTML = `

                        ${
                            user.photoURL
                            ? `
                                <img
                                    class="userAvatar"
                                    src="${user.photoURL}">
                            `
                            : `
                                <div
                                    class="userAvatar"
                                    style="
                                        display:flex;
                                        align-items:center;
                                        justify-content:center;
                                    ">
                                    👤
                                </div>
                            `
                        }

                        <div class="userInfo">

                            <strong>
                                ${escapeHtml(
                                    user.name ||
                                    "User"
                                )}
                            </strong>

                            <small>

                                ${
                                    msg.mediaURL
                                    ? "🖼️ Image"
                                    : escapeHtml(
                                        msg.text ||
                                        "Message"
                                    )
                                }

                            </small>

                        </div>

                        <small>
                            ${formatTime(
                                msg.createdAt
                            )}
                        </small>
                    `;


                    container.appendChild(
                        card
                    );
                }

            },
            error => {

                console.error(
                    "Conversation error:",
                    error
                );
            }
        );
}

/* =========================================================
   STATUS
========================================================= */

async function loadStatuses(){

    if(
        !currentUser
    ){
        return;
    }


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "statuses"
                )
            );


        const grouped = {};


        snapshot.forEach(
            item => {

                const data =
                    item.data();


                if(
                    !data.userId
                ){
                    return;
                }


                /*
                 * Remove expired statuses
                 */

                if(
                    data.expiresAt
                ){

                    const expires =
                        getTime(
                            data.expiresAt
                        );


                    if(
                        expires &&
                        expires <=
                        Date.now()
                    ){

                        return;
                    }
                }


                /*
                 * Ignore completely empty
                 * invalid documents
                 */

                if(
                    !data.text &&
                    !data.mediaURL
                ){

                    return;
                }


                if(
                    !grouped[
                        data.userId
                    ]
                ){

                    grouped[
                        data.userId
                    ] = [];
                }


                grouped[
                    data.userId
                ].push({

                    id:item.id,

                    ...data

                });
            }
        );


        statusGroups = [];


        /*
         * Create groups
         */

        for(
            const uid of Object.keys(
                grouped
            )
        ){

            let user = null;


            /*
             * Current user
             */

            if(
                uid ===
                currentUser.uid
            ){

                user =
                    currentProfile;

            }else{

                /*
                 * Find user in loaded users
                 */

                user =
                    allUsers.find(
                        x =>
                            x.uid ===
                            uid
                    );


                /*
                 * If not found,
                 * load directly from Firestore
                 */

                if(!user){

                    try{

                        const userSnap =
                            await getDoc(
                                doc(
                                    db,
                                    "users",
                                    uid
                                )
                            );


                        if(
                            userSnap.exists()
                        ){

                            user = {

                                uid:uid,

                                ...userSnap.data()

                            };
                        }

                    }catch(error){

                        console.error(
                            "Status user load error:",
                            error
                        );
                    }
                }
            }


            if(!user){
                continue;
            }


            /*
             * Oldest → newest
             */

            const userStatuses =
                grouped[uid]
                .sort(
                    (a,b) =>
                        getTime(
                            a.createdAt
                        ) -
                        getTime(
                            b.createdAt
                        )
                );


            if(
                userStatuses.length
            ){

                statusGroups.push({

                    user:user,

                    statuses:
                        userStatuses

                });
            }
        }


        /*
         * Put current user's status first
         */

        statusGroups.sort(
            (a,b) => {

                if(
                    a.user.uid ===
                    currentUser.uid
                ){
                    return -1;
                }

                if(
                    b.user.uid ===
                    currentUser.uid
                ){
                    return 1;
                }

                return 0;
            }
        );


        renderStatusRow();


    }catch(error){

        console.error(
            "Status loading error:",
            error
        );


        $("statusRow")
            .innerHTML = `

            <div
                style="
                    color:#dc3545;
                    font-size:12px;
                    padding:10px;
                ">

                Unable to load statuses.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>
        `;
    }
}

                            justify-content:center;
                            font-size:25px;
                        ">
                        👤
                    </div>

                    <div>

                        ${escapeHtml(
                            group.user.name ||
                            group.user.username ||
                            "User"
                        )}

                    </div>
                `;
            }


            row.appendChild(
                item
            );
        }
    );
}


/* =========================================================
   CREATE STATUS
========================================================= */

window.createStatus =
async function(){

    if(!currentUser){

        alert(
            "Please login first."
        );

        return;
    }


    const textInput =
        prompt(
            "Write your status text:\n\n" +
            "You can leave it empty if you want to post only a photo."
        );


    if(
        textInput ===
        null
    ){
        return;
    }


    const text =
        textInput
        .trim();


    const addPhoto =
        confirm(
            "Do you want to add a photo to this status?"
        );


    if(!addPhoto){

        if(!text){

            alert(
                "Please write a status or add a photo."
            );

            return;
        }


        await saveStatus(
            text,
            ""
        );


        return;
    }


    const input =
        document.createElement(
            "input"
        );


    input.type =
        "file";


    input.accept =
        "image/*";


    input.onchange =
        async function(){

            const file =
                input.files[0];


            if(!file){
                return;
            }


            try{

                let image =
                    await compressImage(
                        file,
                        500,
                        .55
                    );


                if(
                    image.length >
                    750000
                ){

                    image =
                        await compressImage(
                            file,
                            400,
                            .45
                        );
                }


                if(
                    image.length >
                    950000
                ){

                    alert(
                        "This photo is too large. Please choose another photo."
                    );

                    return;
                }


                await saveStatus(
                    text,
                    image
                );

            }catch(error){

                console.error(
                    "Status image error:",
                    error
                );


                alert(
                    "Unable to process status photo:\n\n" +
                    error.message
                );
            }
        };


    input.click();
};


/* =========================================================
   SAVE STATUS
========================================================= */

async function saveStatus(
    text,
    image
){

    if(!currentUser){
        return;
    }


    try{

        text =
            (text || "")
            .trim();


        image =
            image || "";


        if(
            !text &&
            !image
        ){

            alert(
                "Status cannot be empty."
            );

            return;
        }


        if(
            image &&
            image.length >
            950000
        ){

            alert(
                "Status photo is too large."
            );

            return;
        }


        await addDoc(
            collection(
                db,
                "statuses"
            ),
            {

                userId:
                    currentUser.uid,

                text:
                    text,

                mediaURL:
                    image,

                createdAt:
                    new Date(),

                expiresAt:
                    new Date(
                        Date.now() +
                        24 *
                        60 *
                        60 *
                        1000
                    )
            }
        );


        await loadStatuses();


        alert(
            "Status posted successfully! ✅"
        );


    }catch(error){

        console.error(
            "Save status error:",
            error
        );


        alert(
            "Status failed:\n\n" +
            error.message
        );
    }
}


/* =========================================================
   OPEN STATUS VIEWER
========================================================= */

function openStatusViewer(){

    const group =
        statusGroups[
            currentStatusUserIndex
        ];


    if(!group){

        closeStatusViewer();

        return;
    }


    if(
        !group.statuses ||
        !group.statuses.length
    ){

        closeStatusViewer();

        return;
    }


    if(
        currentStatusIndex <
        0
    ){

        currentStatusIndex =
            0;
    }


    if(
        currentStatusIndex >=
        group.statuses.length
    ){

        currentStatusIndex =
            group.statuses.length - 1;
    }


    $("statusViewer")
        .classList.remove(
            "hidden"
        );


    renderCurrentStatus();
}


/* =========================================================
   RENDER CURRENT STATUS
========================================================= */

function renderCurrentStatus(){

    /* =====================================================
       5 SECOND AUTO STATUS
       CLEAR OLD TIMER FIRST
    ===================================================== */

    if(statusAutoTimer){

        clearTimeout(
            statusAutoTimer
        );

        statusAutoTimer =
            null;
    }


    const group =
        statusGroups[
            currentStatusUserIndex
        ];


    if(!group){
        return;
    }


    const status =
        group.statuses[
            currentStatusIndex
        ];


    if(!status){
        return;
    }


    const progress =
        $("statusProgress");


    progress.innerHTML =
        "";


    group.statuses.forEach(
        (item,index) => {

            const bar =
                document.createElement(
                    "div"
                );


            if(
                index <=
                currentStatusIndex
            ){

                bar.classList.add(
                    "active"
                );
            }


            progress.appendChild(
                bar
            );
        }
    );


    const user =
        group.user;


    const userPhoto =
        user.photoURL ||
        "";


    if(userPhoto){

        $("statusUser")
            .innerHTML = `

                <img
                    src="${userPhoto}"
                    alt="User">

                <div>

                    <div class="statusUserName">

                        ${escapeHtml(
                            user.name ||
                            user.username ||
                            "User"
                        )}

                    </div>

                    <div class="statusUserTime">

                        ${formatTime(
                            status.createdAt
                        )}

                    </div>

                </div>
            `;

    }else{

        $("statusUser")
            .innerHTML = `

                <div
                    class="statusUserAvatar"
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        background:#333;
                        font-size:20px;
                    ">
                    👤
                </div>

                <div>

                    <div class="statusUserName">

                        ${escapeHtml(
                            user.name ||
                            user.username ||
                            "User"
                        )}

                    </div>

                    <div class="statusUserTime">

                        ${formatTime(
                            status.createdAt
                        )}

                    </div>

                </div>
            `;
    }


    const content =
        $("statusContent");


    content.innerHTML = `

        <button
            class="statusNav statusNavLeft"
            onclick="previousStatus()">
        </button>

        <button
            class="statusNav statusNavRight"
            onclick="nextStatus()">
        </button>

    `;


    if(status.mediaURL){

        const image =
            document.createElement(
                "img"
            );


        image.src =
            status.mediaURL;


        image.alt =
            "Status image";


        image.onerror =
            function(){

                console.error(
                    "Status image could not load."
                );
            };


        content.appendChild(
            image
        );
    }


    if(status.text){

        const text =
            document.createElement(
                "div"
            );


        text.className =
            "statusText";


        text.textContent =
            status.text;


        content.appendChild(
            text
        );
    }


    if(
        !status.mediaURL &&
        !status.text
    ){

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "statusEmpty";


        empty.textContent =
            "Empty status";


        content.appendChild(
            empty
        );
    }


    $("statusReplyInput")
        .value =
        "";


    /* =====================================================
       5 SECOND AUTO STATUS
       AFTER DISPLAYING CURRENT STATUS
    ===================================================== */

    statusAutoTimer =
        setTimeout(
            () => {

                nextStatus();

            },
            5000
        );
}


/* =========================================================
   NEXT STATUS
========================================================= */

window.nextStatus =
function(){

    const group =
        statusGroups[
            currentStatusUserIndex
        ];


    if(!group){
        return;
    }


    if(
        currentStatusIndex <
        group.statuses.length - 1
    ){

        currentStatusIndex++;

        renderCurrentStatus();

        return;
    }


    if(
        currentStatusUserIndex <
        statusGroups.length - 1
    ){

        currentStatusUserIndex++;

        currentStatusIndex =
            0;

        renderCurrentStatus();

        return;
    }


    closeStatusViewer();
};


/* =========================================================
   PREVIOUS STATUS
========================================================= */

window.previousStatus =
function(){

    const group =
        statusGroups[
            currentStatusUserIndex
        ];


    if(!group){
        return;
    }


    if(
        currentStatusIndex >
        0
    ){

        currentStatusIndex--;

        renderCurrentStatus();

        return;
    }


    if(
        currentStatusUserIndex >
        0
    ){

        currentStatusUserIndex--;

        const previousGroup =
            statusGroups[
                currentStatusUserIndex
            ];


        currentStatusIndex =
            previousGroup.statuses.length -
            1;


        renderCurrentStatus();

        return;
    }


    closeStatusViewer();
};


/* =========================================================
   CLOSE STATUS
========================================================= */

window.closeStatusViewer =
function(){

    /* =====================================================
       5 SECOND AUTO STATUS
       STOP TIMER WHEN VIEWER CLOSES
    ===================================================== */

    if(statusAutoTimer){

        clearTimeout(
            statusAutoTimer
        );

        statusAutoTimer =
            null;
    }


    $("statusViewer")
        .classList.add(
            "hidden"
        );


    $("statusReplyInput")
        .value =
        "";
};


/* =========================================================
   STATUS REPLY
   FIXED
========================================================= */

window.handleStatusReply =
async function(event){

    if(
        event.key !==
        "Enter"
    ){
        return;
    }


    event.preventDefault();


    const replyInput =
        $("statusReplyInput");


    const replyText =
        replyInput
        .value
        .trim();


    if(!replyText){
        return;
    }


    const group =
        statusGroups[
            currentStatusUserIndex
        ];


    if(!group){
        return;
    }


    const status =
        group.statuses[
            currentStatusIndex
        ];


    if(!status){
        return;
    }


    /*
     * Don't reply to your own status
     */

    if(
        group.user.uid ===
        currentUser.uid
    ){

        alert(
            "You cannot reply to your own status."
        );

        return;
    }


    /*
     * Save information about
     * the status being replied to
     */

    pendingStatusReply = {

        statusId:
            status.id,

        text:
            status.text ||
            "Photo status"
    };


    /*
     * IMPORTANT FIX:
     *
     * Put the actual text typed
     * by the user into the normal
     * message input.
     */

    $("messageInput")
        .value =
        replyText;


    /*
     * Wait until chat is fully opened
     */

    await openChat(
        group.user.uid
    );


    /*
     * Show status preview
     */

    $("replyPreviewText")
        .textContent =
        pendingStatusReply.text;


    $("replyPreview")
        .classList.remove(
            "hidden"
        );


    /*
     * Clear status input
     */

    replyInput.value =
        "";


    /*
     * Close status viewer
     */

    closeStatusViewer();
};


/* =========================================================
   CANCEL STATUS REPLY
========================================================= */

window.cancelStatusReply =
function(){

    pendingStatusReply =
        null;


    $("messageInput")
        .value =
        "";


    $("replyPreview")
        .classList.add(
            "hidden"
        );
};


/* =========================================================
   MODAL
========================================================= */

window.closeModal =
function(id){

    $(id)
        .classList.add(
            "hidden"
        );
};


/* =========================================================
   DARK MODE
========================================================= */

window.toggleDarkMode =
function(){

    document.body
        .classList.toggle(
            "dark"
        );


    localStorage.setItem(
        "dmsDark",
        document.body.classList.contains(
            "dark"
        )
        ? "1"
        : "0"
    );
};


if(
    localStorage.getItem(
        "dmsDark"
    ) === "1"
){

    document.body
        .classList.add(
            "dark"
        );
}

        await updateOnlineStatus(

        );

    );
