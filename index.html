<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DMS Chat</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#fff5fa;
    color:#333;
}

body.dark{
    background:#171219;
    color:#eee;
}

button{
    cursor:pointer;
    border:none;
}

input,textarea{
    font-family:inherit;
}

.hidden{
    display:none!important;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#ff1493,#ff69b4);
    color:white;
    padding:16px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 3px 12px rgba(255,20,147,.25);
}

.header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.header button{
    background:rgba(255,255,255,.2);
    color:white;
    padding:9px 12px;
    border-radius:20px;
}

/* PAGES */
.page{
    display:none;
    padding:15px;
    padding-bottom:90px;
}

.page.active{
    display:block;
}

/* AUTH */
.auth-container{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#ffe1ef,#fff);
}

.auth-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:25px;
    border-radius:22px;
    box-shadow:0 10px 35px rgba(255,20,147,.15);
}

.auth-logo{
    text-align:center;
    color:#ff1493;
    font-size:30px;
    font-weight:bold;
    margin-bottom:8px;
}

.auth-subtitle{
    text-align:center;
    color:#888;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    font-size:13px;
    margin-bottom:6px;
    color:#777;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:13px;
    border:1px solid #ffd0e5;
    border-radius:12px;
    outline:none;
    background:#fff;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:#ff1493;
}

.primary-btn{
    width:100%;
    background:linear-gradient(135deg,#ff1493,#ff69b4);
    color:white;
    padding:13px;
    border-radius:12px;
    font-weight:bold;
}

.secondary-btn{
    width:100%;
    background:#ffe1ef;
    color:#ff1493;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
    font-weight:bold;
}

.auth-link{
    text-align:center;
    margin-top:15px;
    color:#ff1493;
    cursor:pointer;
}

/* CARDS */
.card{
    background:white;
    border-radius:18px;
    padding:15px;
    margin-bottom:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}

body.dark .card,
body.dark .auth-box{
    background:#241c24;
    color:#eee;
}

body.dark input,
body.dark textarea,
body.dark select{
    background:#302630;
    color:#fff;
    border-color:#5a4052;
}

/* SEARCH */
.search-box{
    width:100%;
    padding:13px;
    border:1px solid #ffd0e5;
    border-radius:15px;
    margin-bottom:15px;
    outline:none;
}

/* USERS */
.user-card{
    display:flex;
    align-items:center;
    gap:12px;
}

.user-photo{
    width:55px;
    height:55px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #ff69b4;
}

.user-info{
    flex:1;
}

.user-name{
    font-weight:bold;
}

.user-bio{
    font-size:13px;
    color:#888;
    margin-top:4px;
}

.small-btn{
    background:#ffe1ef;
    color:#ff1493;
    padding:9px 12px;
    border-radius:10px;
    font-weight:bold;
}

.chat-btn{
    background:#ff1493;
    color:white;
}

/* STATUS */
.status-section{
    margin-bottom:20px;
}

.status-list{
    display:flex;
    overflow-x:auto;
    gap:15px;
    padding:5px 2px 12px;
}

.status-item{
    min-width:72px;
    text-align:center;
    cursor:pointer;
}

.status-ring{
    width:64px;
    height:64px;
    margin:auto;
    padding:3px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff1493,#ff69b4,#ffb6d9);
}

.status-ring img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    border:3px solid white;
}

.add-status{
    width:64px;
    height:64px;
    border-radius:50%;
    background:#ffe1ef;
    color:#ff1493;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    margin:auto;
    border:3px solid #ff69b4;
}

.status-name{
    margin-top:5px;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* CHAT */
.chat-page{
    padding:0;
    padding-bottom:70px;
}

.chat-header{
    background:linear-gradient(135deg,#ff1493,#ff69b4);
    color:white;
    padding:12px;
    display:flex;
    align-items:center;
    gap:10px;
}

.chat-header img{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid white;
}

.chat-header-info{
    flex:1;
}

.back-btn{
    background:transparent;
    color:white;
    font-size:24px;
}

.messages{
    padding:15px;
    min-height:calc(100vh - 145px);
    background:#fff7fb;
}

body.dark .messages{
    background:#171219;
}

.message-row{
    display:flex;
    margin-bottom:8px;
}

.message-row.me{
    justify-content:flex-end;
}

.message{
    max-width:78%;
    padding:10px 12px;
    border-radius:15px;
    background:white;
    box-shadow:0 2px 6px rgba(0,0,0,.05);
}

.message-row.me .message{
    background:#ff1493;
    color:white;
    border-bottom-right-radius:4px;
}

.message-row:not(.me) .message{
    border-bottom-left-radius:4px;
}

.message-time{
    font-size:10px;
    opacity:.7;
    margin-top:4px;
    text-align:right;
}

.message-status{
    margin-left:4px;
}

.chat-input-area{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:white;
    padding:10px;
    display:flex;
    gap:8px;
    border-top:1px solid #eee;
    z-index:30;
}

body.dark .chat-input-area{
    background:#241c24;
    border-color:#402f3b;
}

.chat-input{
    flex:1;
    border:1px solid #ffd0e5;
    border-radius:20px;
    padding:11px 15px;
    outline:none;
}

.send-btn{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#ff1493;
    color:white;
    font-size:18px;
}

/* CONVERSATIONS */
.conversation{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px;
    background:white;
    border-radius:15px;
    margin-bottom:10px;
}

body.dark .conversation{
    background:#241c24;
}

.conversation-info{
    flex:1;
}

.last-message{
    color:#888;
    font-size:13px;
    margin-top:4px;
}

/* PROFILE */
.profile{
    text-align:center;
}

.profile-large{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid #ff69b4;
}

.profile-name{
    font-size:23px;
    font-weight:bold;
    margin-top:10px;
}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:white;
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 -3px 15px rgba(0,0,0,.08);
    z-index:25;
}

body.dark .bottom-nav{
    background:#241c24;
}

.nav-btn{
    background:transparent;
    color:#888;
    font-size:11px;
    text-align:center;
}

.nav-btn span{
    display:block;
    font-size:21px;
    margin-bottom:2px;
}

.nav-btn.active{
    color:#ff1493;
}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:100%;
    max-width:500px;
    max-height:92vh;
    overflow:auto;
    border-radius:20px;
    padding:15px;
}

body.dark .modal-box{
    background:#241c24;
    color:white;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.close-btn{
    background:#ffe1ef;
    color:#ff1493;
    width:35px;
    height:35px;
    border-radius:50%;
    font-size:20px;
}

/* STATUS VIEWER */
.status-view{
    text-align:center;
}

.status-media{
    width:100%;
    max-height:65vh;
    object-fit:contain;
    border-radius:12px;
    background:#111;
}

.status-text{
    background:#ffe1ef;
    color:#333;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
    font-size:17px;
    text-align:center;
    word-break:break-word;
}

.status-progress{
    display:flex;
    gap:4px;
    margin-bottom:12px;
}

.status-progress-bar{
    flex:1;
    height:4px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
}

.status-progress-bar.active{
    background:#ff1493;
}

/* STATUS CREATION */
.preview-image{
    max-width:100%;
    max-height:250px;
    display:block;
    margin:10px auto;
    border-radius:12px;
}

/* REPLY PREVIEW */
.reply-preview{
    display:none;
    background:#ffe1ef;
    color:#ff1493;
    padding:8px 12px;
    border-radius:10px;
    margin-bottom:5px;
    font-size:12px;
}

.reply-preview.show{
    display:block;
}

/* EMPTY */
.empty{
    text-align:center;
    color:#999;
    padding:35px 10px;
}

/* LOADING */
.loading{
    text-align:center;
    color:#ff1493;
    padding:20px;
}

/* ONLINE */
.online-dot{
    width:9px;
    height:9px;
    background:#22c55e;
    border-radius:50%;
    display:inline-block;
}

/* SCROLLBAR */
::-webkit-scrollbar{
    width:4px;
    height:4px;
}

::-webkit-scrollbar-thumb{
    background:#ff69b4;
    border-radius:10px;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="authScreen" class="auth-container">

    <div class="auth-box">

        <div class="auth-logo">
            DMS Chat 💗
        </div>

        <div class="auth-subtitle">
            Connect • Communicate • Chat
        </div>

        <!-- LOGIN -->
        <div id="loginForm">

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter email"
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter password"
                >
            </div>

            <button
                class="primary-btn"
                onclick="loginUser()">
                Login
            </button>

            <div
                class="auth-link"
                onclick="showRegister()">
                Create New Account
            </div>

            <div
                class="auth-link"
                onclick="resetPassword()">
                Forgot Password?
            </div>

        </div>


        <!-- REGISTER -->
        <div id="registerForm" class="hidden">

            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    id="registerName"
                    placeholder="Your name"
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email"
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Minimum 6 characters"
                >
            </div>

            <div class="form-group">
                <label>Bio</label>
                <textarea
                    id="registerBio"
                    placeholder="Tell people about yourself"
                    rows="3"></textarea>
            </div>

            <button
                class="primary-btn"
                onclick="registerUser()">
                Create Account
            </button>

            <div
                class="auth-link"
                onclick="showLogin()">
                Already have an account? Login

        </div>

    </div>
</div>


<!-- APP -->
<div id="app" class="hidden">

    <!-- HEADER -->

        <div class="header-row">

                DMS Chat 💗
            </div>

            <button onclick="toggleDarkMode()">
                🌙

    </div>

    <!-- PROFILE -->

    <!-- BOTTOM NAV -->
    <div
        id="bottomNav"
        class="bottom-nav">

        <button
            class="nav-btn active"
            onclick="showPage('homePage',this)">
            <span>🏠</span>

        </button>

        <button
            class="nav-btn"
            onclick="showPage('discoverPage',this)">
            <span>🔍</span>
            Discover
        </button>

        <button
            class="nav-btn"
            onclick="showPage('messagesPage',this)">
            <span>💬</span>
            Messages
        </button>

        <button
            class="nav-btn"
            onclick="showPage('profilePage',this)">
            <span>👤</span>
            Profile
        </button>

    </div>

</div>


<!-- CHAT INPUT -->
<div
    id="chatInputArea"
    class="chat-input-area hidden">

    <div
        id="replyPreview"
        class="reply-preview">
    </div>

    <input
        id="messageInput"
        class="chat-input"
        placeholder="Type a message..."
        onkeydown="handleMessageKey(event)"
    >

    <button
        class="send-btn"
        onclick="sendMessage()">
        ➤
    </button>

</div>


<!-- CREATE STATUS MODAL -->
<div
    id="createStatusModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h3>Create Status</h3>

            <button
                class="close-btn"
                onclick="closeCreateStatus()">
                ×
            </button>

        </div>

        <div class="form-group">

            <textarea
                id="statusText"
                rows="4"
                placeholder="Write a status..."></textarea>

        </div>

        <div class="form-group">

            <label>Photo (optional)</label>

            <input
                type="file"
                id="statusImage"

        </div>

        <img
            id="statusPreview"
            class="preview-image hidden"
        >

        <button
            class="primary-btn"
            onclick="createStatus()">
            Post Status
        </button>

    </div>

</div>


<!-- VIEW STATUS MODAL -->
<div
    id="viewStatusModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h3 id="viewStatusName">
                Status
            </h3>

            <button
                class="close-btn"
                onclick="closeViewStatus()">
                ×
            </button>

        </div>

        <div
            id="statusViewContent"
            class="status-view">
        </div>

    </div>

</div>


<!-- EDIT PROFILE MODAL -->
<div
    id="editProfileModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h3>Edit Profile</h3>

            <button
                class="close-btn"
                onclick="closeEditProfile()">
                ×
            </button>

        </div>

        <div class="form-group">

            <label>Name</label>

            <input
                id="editName"
                type="text"
            >

        </div>

        <div class="form-group">

            <label>Bio</label>

            <textarea
                id="editBio"
                rows="4"></textarea>

        </div>

        <div class="form-group">

            <label>Profile Photo</label>

            <input
                id="editPhoto"
                type="file"
                accept="image/*"
                onchange="previewProfileImage(event)"
            >

        </div>

        <img
            id="editPhotoPreview"
            class="preview-image hidden"
        >

        <button
            class="primary-btn"
            onclick="saveProfile()">
            Save Changes
        </button>

    </div>

</div>

/* GLOBAL VARIABLES */

/* HELPERS */

window.escapeHtml = function(text){

    if(!text) return "";

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
};


function formatTime(timestamp){

    if(!timestamp) return "";

    return new Date(timestamp)
        .toLocaleTimeString([],{
            hour:"2-digit",
            minute:"2-digit"
        });
}


function formatDate(timestamp){

    if(!timestamp) return "";

    return new Date(timestamp)
        .toLocaleDateString();
}


/* IMAGE COMPRESSION */

function compressImage(file,maxSize=500,quality=.7){

    return new Promise((resolve,reject)=>{

        const reader =
            new FileReader();

        reader.onload = function(e){

            const img =
                new Image();

            img.onload = function(){

                let width =
                    img.width;

                let height =
                    img.height;


                if(width > maxSize ||
                   height > maxSize){

                    if(width > height){

                        height =
                            height *
                            maxSize /
                            width;

                        width =
                            maxSize;

                    }else{

                        width =
                            width *
                            maxSize /
                            height;

                        height =
                            maxSize;
                    }
                }


                const canvas =
                    document.createElement("canvas");

                canvas.width =
                    width;

                canvas.height =
                    height;


                const ctx =
                    canvas.getContext("2d");

                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );


                resolve(
                    canvas.toDataURL(
                        "image/jpeg",
                        quality
                    )
                );
            };

            img.onerror = reject;

            img.src =

/* MESSAGES */

function getParticipants(uid1,uid2){

    return [
        uid1,
        uid2
    ].sort();
}


function subscribeToMessages(){

    if(unsubscribeMessages){

        unsubscribeMessages();
    }


    const participants =
        getParticipants(
            currentUser.uid,
            activeChatUser.uid
        );


    const q =
        query(
            collection(db,"messages"),
            where(
                "participants",
                "==",
                participants
            )
        );


    unsubscribeMessages =
        onSnapshot(
            q,
            snapshot => {

                let messages =
                    snapshot.docs
                    .map(d => ({
                        id:d.id,
                        ...d.data()
                    }));


                messages.sort(
                    (a,b) =>
                        (a.createdAt || 0) -
                        (b.createdAt || 0)
                );


                renderMessages(messages);

            },
            error => {

                console.error(error);

                document
                    .getElementById(
                        "messagesContainer"
                    )
                    .innerHTML =
                    `<div class="empty">
                        Unable to load messages.
                     </div>`;
            }
        );
}


function renderMessages(messages){

    const container =
        document.getElementById(
            "messagesContainer"
        );


    if(!messages.length){

        container.innerHTML =
            `<div class="empty">
                No messages yet.<br>
                Start the conversation 💗
             </div>`;

        return;
    }


    container.innerHTML =
        messages.map(message => {

            const me =
                message.sender ===
                currentUser.uid;


            let status = "";


            if(me){

                if(message.read){

                    status =
                        '<span class="message-status" style="color:#8be9fd">✓✓ Seen</span>';

                }else if(message.delivered){

                    status =
                        '<span class="message-status">✓✓</span>';

                }else{

                    status =
                        '<span class="message-status">✓</span>';
                }
            }


            let replyHTML = "";


            if(message.statusReply){

                replyHTML = `

                    <div style="
                        background:rgba(255,255,255,.18);
                        padding:7px;
                        border-radius:8px;
                        margin-bottom:5px;
                        font-size:11px;
                    ">

                        📸 Reply to Status

                    </div>
                `;
            }


            return `

                <div class="message-row ${me ? "me" : ""}">

                    <div
                        class="message"
                        oncontextmenu="
                            event.preventDefault();
                            deleteMessage(
                                '${message.id}'
                            )
                        "
                    >

                        ${replyHTML}

                        ${
                            message.text
                            ?
                            `<div>
                                ${escapeHtml(
                                    message.text
                                )}
                             </div>`
                            :
                            ""
                        }

                        <div class="message-time">

                            ${formatTime(
                                message.createdAt
                            )}

                            ${status}

                        </div>

                    </div>

                </div>
            `;

        }).join("");


    container.scrollTop =
        container.scrollHeight;
}

/* CONVERSATIONS */

async function renderConversations(){

    const container =
        document.getElementById(
            "conversations"
        );


    if(!currentUser){

        return;
    }


    try{

        const q =
            query(
                collection(db,"messages"),
                where(
                    "participants",
                    "array-contains",
                    currentUser.uid
                )
            );


        const snap =
            await getDocs(q);


        const messages =
            snap.docs.map(d => ({
                id:d.id,
                ...d.data()
            }));


        const latest = {};


        messages.forEach(message => {

            const other =
                message.sender ===
                currentUser.uid
                ?
                message.receiver
                :
                message.sender;


            if(
                !latest[other] ||
                (
                    message.createdAt || 0
                ) >
                (
                    latest[other].createdAt || 0
                )
            ){

                latest[other] =
                    message;
            }
        });


        const entries =
            Object.entries(latest)
            .sort(
                (a,b) =>
                    (b[1].createdAt || 0) -
                    (a[1].createdAt || 0)
            );


        if(!entries.length){

            container.innerHTML =
                `<div class="empty">
                    No conversations yet.<br>
                    Find someone to chat with 💗
                 </div>`;

            return;
        }


        let html = "";


        for(
            const [uid,message]
            of entries
        ){

            let user =
                allUsers.find(
                    u => u.uid === uid
                );


            if(!user){

                const userSnap =
                    await getDoc(
                        doc(
                            db,
                            "users",
                            uid
                        )
                    );


                if(userSnap.exists()){

                    user = userSnap.data();
                }
            }


            if(!user) continue;


            const photo =
                user.photoURL ||
                "https://via.placeholder.com/64/ffd6e8/ff1493?text=👤";


            html += `

                <div
                    class="conversation"
                    onclick="
                        openChatByUid(
                            '${uid}'
                        )
                    "
                >

                    <img
                        class="user-photo"
                        src="${photo}"
                    >

                    <div class="conversation-info">

                        <div class="user-name">

                            ${escapeHtml(
                                user.name ||
                                "User"
                            )}

                        </div>

                        <div class="last-message">

                            ${
                                message.statusReply
                                ?
                                "📸 Reply to Status"
                                :
                                escapeHtml(
                                    message.text ||
                                    ""
                                )
                            }

                        </div>

                    </div>

                    <small>
                        ${formatDate(
                            message.createdAt
                        )}
                    </small>

                </div>
            `;
        }


        container.innerHTML =
            html ||
            `<div class="empty">
                No conversations yet.
             </div>`;

    }catch(error){

        console.error(error);

        container.innerHTML =
            `<div class="empty">
                Unable to load conversations.
             </div>`;
    }
}

/*
==========================================
STATUS GROUPING
==========================================
*/

async function getStatusGroups(){

    const snap =
        await getDocs(
            collection(db,"statuses")
        );


    let statuses =
        snap.docs.map(d => ({
            id:d.id,
            ...d.data()
        }));


    const now =
        Date.now();


    // Remove expired statuses
    statuses =
        statuses.filter(status =>
            !status.expiresAt ||
            status.expiresAt > now
        );


    const groups = {};


    statuses.forEach(status => {

        if(!groups[status.uid]){

            groups[status.uid] = [];
        }


        groups[status.uid].push(status);
    });


    // IMPORTANT:
    // Status 1 -> Status 2 -> Status 3
    Object.keys(groups).forEach(uid => {

        groups[uid].sort(
            (a,b) =>
                (a.createdAt || 0) -
                (b.createdAt || 0)
        );
    });


    statusGroups =
        Object.keys(groups)
        .map(uid => ({

            uid:uid,

            statuses:
                groups[uid]

        }));


    // Newest active user status first
    statusGroups.sort(
        (a,b) => {

            const aLatest =
                Math.max(
                    ...a.statuses.map(
                        s => s.createdAt || 0
                    )
                );

            const bLatest =
                Math.max(
                    ...b.statuses.map(
                        s => s.createdAt || 0
                    )
                );

            return bLatest - aLatest;
        }
    );


    return statusGroups;
}

            "Status loading error:",
            error
        );
    }
}


/*
==========================================
OPEN STATUS VIEWER
==========================================
*/

window.openStatusViewer = function(uid){

    const groupIndex =
        statusGroups.findIndex(
            group =>
                group.uid === uid
        );


    if(groupIndex === -1){

        return;
    }


    currentStatusUserIndex =
        groupIndex;


    currentStatusIndex =
        0;


    openCurrentStatus();
};


/*
==========================================
STATUS VIEW
==========================================
*/

function openCurrentStatus(){

    const group =
        statusGroups[
            currentStatusUserIndex
        ];


    if(!group){

        closeViewStatus();

        return;
    }


    const statuses =
        group.statuses;


    if(!statuses.length){

        closeViewStatus();

        return;
    }


    /*
    If status index is beyond
    current user's statuses,
    automatically go to next user.
    */

    if(
        currentStatusIndex >=
        statuses.length
    ){

        currentStatusUserIndex++;

        currentStatusIndex = 0;


        if(
            currentStatusUserIndex >=
            statusGroups.length
        ){

            closeViewStatus();

            return;
        }


        openCurrentStatus();

        return;
    }


    const status =
        statuses[
            currentStatusIndex
        ];


    let user = null;


    if(
        status.uid ===
        currentUser.uid
    ){

        user =
            currentProfile;

    }else{

        user =
            allUsers.find(
                u => u.uid === status.uid
            );
    }


    const name =
        status.name ||
        user?.name ||
        "User";


    document
        .getElementById(
            "viewStatusName"
        )
        .textContent =
        name;


    /*
    PROGRESS BARS

    Example:

    Status 1 / 3
    [████] [    ] [    ]

    Status 2 / 3
    [████] [████] [    ]

    Status 3 / 3
    [████] [████] [████]
    */

    let progressHTML = `

        <div class="status-progress">
    `;


    statuses.forEach(
        (s,index) => {

            progressHTML += `

                <div
                    class="
                        status-progress-bar
                        ${
                            index <=
                            currentStatusIndex
                            ?
                            "active"
                            :
                            ""
                        }
                    ">
                </div>
            `;
        }
    );


    progressHTML += `
        </div>
    `;


    let html =
        progressHTML;


    /*
    MEDIA
    */

    if(status.mediaURL){

        html += `

            <img
                class="status-media"
                src="${status.mediaURL}"
            >
        `;
    }


    /*
    TEXT
    */

    if(status.text){

        html += `

            <div class="status-text">

                ${escapeHtml(
                    status.text
                )}

            </div>
        `;
    }


    /*
    STATUS NUMBER
    */

    html += `

        <div style="
            margin-top:10px;
            color:#999;
            font-size:12px;
        ">

            Status
            ${currentStatusIndex + 1}
            /
            ${statuses.length}

        </div>
    `;


    /*
    BUTTONS
    */

    html += `

        <div style="
            display:flex;
            justify-content:space-between;
            gap:8px;
            margin-top:15px;
        ">

            <button
                class="small-btn"
                onclick="previousStatus()">

                ◀ Previous

            </button>


            ${
                status.uid !==
                currentUser.uid
                ?
                `
                <button
                    class="small-btn chat-btn"
                    onclick="
                        replyToStatus(
                            '${status.id}',
                            '${status.uid}'
                        )
                    ">

                    💬 Reply

                </button>
                `
                :
                `
                <button
                    class="small-btn"
                    onclick="
                        deleteStatus(
                            '${status.id}'
                        )
                    ">

                    🗑 Delete

                </button>
                `
            }


            <button
                class="small-btn"
                onclick="nextStatus()">

                Next ▶

            </button>

        </div>
    `;


    document
        .getElementById(
            "statusViewContent"
        )
        .innerHTML =
        html;


    document
        .getElementById(
            "viewStatusModal"
        )
        .classList.add("show");
}


/*
==========================================
NEXT STATUS
==========================================
*/

window.nextStatus = function(){

    const group =
        statusGroups[
            currentStatusUserIndex
        ];


    if(!group){

        closeViewStatus();

        return;
    }


    /*
    SAME USER:

    1 -> 2 -> 3
    */

    if(
        currentStatusIndex <
        group.statuses.length - 1
    ){

        currentStatusIndex++;

        openCurrentStatus();

        return;
    }


    /*
    LAST STATUS OF THIS USER

    Move to next user
    */

    currentStatusUserIndex++;

    currentStatusIndex = 0;


    /*
    NEXT USER
    */

    if(
        currentStatusUserIndex <
        statusGroups.length
    ){

        openCurrentStatus();

    }else{

        /*
        No more users
        */

        closeViewStatus();
    }
};


/*
==========================================
PREVIOUS STATUS
==========================================
*/

window.previousStatus = function(){

    /*
    Previous status of same user
    */

    if(currentStatusIndex > 0){

        currentStatusIndex--;

        openCurrentStatus();

        return;
    }


    /*
    First status of current user

    Go to previous user's
    LAST status.
    */

    if(currentStatusUserIndex > 0){

        currentStatusUserIndex--;

        const previousGroup =
            statusGroups[
                currentStatusUserIndex
            ];


        currentStatusIndex =
            previousGroup.statuses.length - 1;


        openCurrentStatus();

    }else{

        /*
        Already at first status
        */

        closeViewStatus();
    }
};


/*
==========================================
CLOSE STATUS
==========================================
*/

window.closeViewStatus = function(){

    document
        .getElementById(
            "viewStatusModal"
        )
        .classList.remove("show");
};


/*
==========================================
DELETE STATUS
==========================================
*/

window.deleteStatus = async function(id){

    if(!confirm(
        "Delete this status?"
    )){

        return;
    }


    try{

        const ref =
            doc(
                db,
                "statuses",
                id
            );


        const snap =
            await getDoc(ref);


        if(!snap.exists()){

            return;
        }


        if(
            snap.data().uid !==
            currentUser.uid
        ){

            alert(
                "You can only delete your own status."
            );

            return;
        }


        await deleteDoc(ref);

        closeViewStatus();

        await renderStatuses();

    }catch(error){

        alert(error.message);
    }
};


/*
==========================================
REPLY TO STATUS
==========================================
*/

window.replyToStatus = async function(
    statusId,
    uid
){

    try{

        const snap =
            await getDoc(
                doc(
                    db,
                    "statuses",
                    statusId
                )
            );


        if(!snap.exists()){

            alert(
                "Status no longer exists."
            );

            return;
        }


        const status =
            snap.data();


        if(
            status.expiresAt &&
            status.expiresAt <= Date.now()
        ){

            alert(
                "This status has expired."
            );

            return;
        }


        const user =
            allUsers.find(
                u => u.uid === uid
            );


        if(!user){

            alert("User not found.");

            return;
        }


        pendingStatusReply = {

            statusId:
                statusId,

            text:
                status.text ||
                "",

            mediaURL:
                status.mediaURL ||
                "",

            name:
                status.name ||
                user.name ||
                "Status"
        };


        closeViewStatus();

        await openChatByUid(uid);

        showReplyPreview();

    }catch(error){

        alert(error.message);
    }
};


function showReplyPreview(){

    const preview =
        document.getElementById(
            "replyPreview"
        );


    if(!pendingStatusReply){

        preview.classList.remove(
            "show"
        );

        return;
    }


    preview.innerHTML = `

        📸 Replying to
        <b>
            ${escapeHtml(
                pendingStatusReply.name
            )}
        </b>

        ${
            pendingStatusReply.text
            ?
            ` — ${escapeHtml(
                pendingStatusReply.text
            )}`
            :
            ""
        }

    `;


    preview.classList.add(
        "show"
    );
}


function hideReplyPreview(){

    document
        .getElementById(
            "replyPreview"
        )
        .classList.remove(
            "show"
        );
}


/* DARK MODE */

window.toggleDarkMode = function(){

    document.body
        .classList.toggle("dark");


    localStorage.setItem(
        "dmsDarkMode",
        document.body
            .classList.contains("dark")
            ? "1"
            : "0"
    );
};


if(
    localStorage.getItem(
        "dmsDarkMode"
    ) === "1"
){

    document.body
        .classList.add("dark");
}
